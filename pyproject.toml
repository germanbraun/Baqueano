[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "baqueano"
version = "0.1.0"
description = "A pathfinder for unknown SPARQL endpoints."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rdflib>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
baqueano = "baqueano.cli:main"

[tool.setuptools.packages.find]
include = ["baqueano*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
